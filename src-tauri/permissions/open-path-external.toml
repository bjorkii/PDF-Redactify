# 앱 커맨드 권한(수기 작성). identifier는 kebab-case만 허용되므로 command 이름
# (snake_case)과 별도로 관리한다.
[[permission]]
identifier = "allow-open-path-external"
description = "Enables the open_path_external command without any pre-configured scope."
commands.allow = ["open_path_external"]

[[permission]]
identifier = "deny-open-path-external"
description = "Denies the open_path_external command without any pre-configured scope."
commands.deny = ["open_path_external"]
