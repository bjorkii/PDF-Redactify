# 앱 커맨드 권한(수기 작성). identifier는 kebab-case만 허용되므로 command 이름
# (snake_case)과 별도로 관리한다.
[[permission]]
identifier = "allow-get-bookmarks"
description = "Enables the get_bookmarks command without any pre-configured scope."
commands.allow = ["get_bookmarks"]

[[permission]]
identifier = "deny-get-bookmarks"
description = "Denies the get_bookmarks command without any pre-configured scope."
commands.deny = ["get_bookmarks"]
