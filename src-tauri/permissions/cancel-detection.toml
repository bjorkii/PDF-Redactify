# 앱 커맨드 권한(수기 작성). identifier는 kebab-case만 허용되므로 command 이름
# (snake_case)과 별도로 관리한다.
[[permission]]
identifier = "allow-cancel-detection"
description = "Enables the cancel_detection command without any pre-configured scope."
commands.allow = ["cancel_detection"]

[[permission]]
identifier = "deny-cancel-detection"
description = "Denies the cancel_detection command without any pre-configured scope."
commands.deny = ["cancel_detection"]
