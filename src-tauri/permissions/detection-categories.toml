# 앱 커맨드 권한(수기 작성). identifier는 kebab-case만 허용되므로 command 이름
# (snake_case)과 별도로 관리한다.
[[permission]]
identifier = "allow-save-detection-categories"
description = "Enables the save_detection_categories command without any pre-configured scope."
commands.allow = ["save_detection_categories"]

[[permission]]
identifier = "allow-load-detection-categories"
description = "Enables the load_detection_categories command without any pre-configured scope."
commands.allow = ["load_detection_categories"]
