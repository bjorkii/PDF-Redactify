# 앱 커맨드 권한(수기 작성). identifier는 kebab-case만 허용되므로 command 이름
# (snake_case)과 별도로 관리한다.
[[permission]]
identifier = "allow-extract-text-in-bbox"
description = "Enables the extract_text_in_bbox command without any pre-configured scope."
commands.allow = ["extract_text_in_bbox"]

[[permission]]
identifier = "deny-extract-text-in-bbox"
description = "Denies the extract_text_in_bbox command without any pre-configured scope."
commands.deny = ["extract_text_in_bbox"]
