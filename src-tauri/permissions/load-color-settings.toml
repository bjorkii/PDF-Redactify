# 앱 커맨드 권한(수기 작성). identifier는 kebab-case만 허용되므로 command 이름
# (snake_case)과 별도로 관리한다.
[[permission]]
identifier = "allow-load-color-settings"
description = "Enables the load_color_settings command without any pre-configured scope."
commands.allow = ["load_color_settings"]

[[permission]]
identifier = "deny-load-color-settings"
description = "Denies the load_color_settings command without any pre-configured scope."
commands.deny = ["load_color_settings"]
