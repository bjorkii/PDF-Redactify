# 앱 커맨드 권한(수기 작성). identifier는 kebab-case만 허용되므로 command 이름
# (snake_case)과 별도로 관리한다.
[[permission]]
identifier = "allow-export-review-items"
description = "Enables the export_review_items command without any pre-configured scope."
commands.allow = ["export_review_items"]

[[permission]]
identifier = "deny-export-review-items"
description = "Denies the export_review_items command without any pre-configured scope."
commands.deny = ["export_review_items"]
