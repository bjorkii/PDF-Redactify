# 앱 커맨드 권한(수기 작성). identifier는 kebab-case만 허용되므로 command 이름
# (snake_case)과 별도로 관리한다.
[[permission]]
identifier = "allow-detect-review-items"
description = "Enables the detect_review_items command without any pre-configured scope."
commands.allow = ["detect_review_items"]

[[permission]]
identifier = "deny-detect-review-items"
description = "Denies the detect_review_items command without any pre-configured scope."
commands.deny = ["detect_review_items"]
