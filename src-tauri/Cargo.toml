[package]
name = "pdf-redactify"
version = "0.1.0"
description = "PDF-Redactify — 텍스트 레이어 기반 PDF 블랙마킹 도구"
authors = ["PDF-Redactify"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "pdf_redactify_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pdfium-render = "0.9.3"
tauri-plugin-dialog = "2.7.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
jpeg-encoder = "0.6"
base64 = "0.23.0"
sha2 = "0.11.0"
ts-rs = "12.0.1"
regex = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
rust_xlsxwriter = "0.96.0"
calamine = "0.36.0"
# QP-1: 재래스터 비트맵 예산 산정을 위한 3-OS(macOS·Windows·Linux) 공통 가용 메모리 조회.
sysinfo = { version = "0.33", default-features = false, features = ["system"] }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
tempfile = "3.27.0"

# 이미지 인코딩/디코딩은 unoptimized(dev) 빌드에서 수십 배 느려 렌더 관련
# 테스트가 비정상적으로 오래 걸린다(§9.1 성능 목표는 release 기준). 우리
# 크레이트 자체의 증분 빌드 속도는 유지하면서 무거운 의존성만 최적화한다.
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package.pdfium-render]
opt-level = 3

